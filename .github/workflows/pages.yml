name: Deploy app-web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar app-web
        shell: bash
        run: |

          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: app-web no contiene index.html"
            exit 1
          fi

          echo
          echo "INDEX PRINCIPAL:"
          echo "_site/index.html"

          echo
          echo "ARCHIVOS PUBLICADOS:"
          find _site -maxdepth 3 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4