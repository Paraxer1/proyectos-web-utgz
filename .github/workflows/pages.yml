name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

          if [ -f "_site/index.html" ]; then
            echo "index.html encontrado."

          elif [ -f "_site/Practica1.html" ]; then
            echo "Usando Practica1.html como index.html"
            cp "_site/Practica1.html" "_site/index.html"

          else
            echo "ERROR: No existe index.html ni Practica1.html"
            exit 1
          fi

          echo ""
          echo "Archivos que GitHub publicara:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4