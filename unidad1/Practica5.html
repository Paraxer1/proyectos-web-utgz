    <div class="container mt-4">
        <div class="row g-0">
            <div class="col-md-4 g-0">
                <h1 class="mb-3">Calculadora</h1>

                <div class="row g-2">
                    
                    <div class="col-12">
                        <input id="et_resultado" class="form-control text-end fs-4" style="border: 1.5px solid black;" type="text" value="0" readonly>
                    </div>

                    <div class="col-3">
                        <button id="btn_7" class="btn btn-primary w-100 py-2 btn-calc">7</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_8" class="btn btn-primary w-100 py-2 btn-calc">8</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_9" class="btn btn-primary w-100 py-2 btn-calc">9</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_multi" class="btn btn-warning w-100 py-2 btn-calc">&times;</button>
                    </div>

                    <div class="col-3">
                        <button id="btn_4" class="btn btn-primary w-100 py-2 btn-calc">4</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_5" class="btn btn-primary w-100 py-2 btn-calc">5</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_6" class="btn btn-primary w-100 py-2 btn-calc">6</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_menos" class="btn btn-warning w-100 py-2 btn-calc">&minus;</button>
                    </div>
                    
                    <div class="col-3">
                        <button id="btn_1" class="btn btn-primary w-100 py-2 btn-calc">1</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_2" class="btn btn-primary w-100 py-2 btn-calc">2</button>
                    </div>
                    <div class="col-3">
                        <button id="btn3" class="btn btn-primary w-100 py-2 btn-calc">3</button>
                    </div>
                    <div class="col-3">
                        <button id="btn_mas" class="btn btn-warning w-100 py-2 btn-calc">+</button>
                    </div>  

                    <div class="col-3">
                        <button id="btn_masmenos" class="btn btn-warning w-100 py-2 btn-calc">+/-</button>
                    </div>  
                    <div class="col-3">
                        <button id="btn_0" class="btn btn-warning w-100 py-2 btn-calc">0</button>
                    </div>  
                    <div class="col-3">
                        <button id="btn_punto" class="btn btn-warning w-100 py-2 btn-calc">.</button>
                    </div>  
                    <div class="col-3">
                        <button id="btn_igual" class="btn btn-warning w-100 py-2 btn-calc">=</button>
                    </div>  
                </div>
            </div>
        </div>
    </div>
    <script>
        const et_resultado = document.getElementById('et_resultado');
        let primerNumero = null;
        let operacion = '';
        let nuevoNumero = true;

        // Conectar los diez botones numéricos con la pantalla.
        for (let numero = 0; numero <= 9; numero++) {
            const id = numero === 3 ? 'btn3' : 'btn_' + numero;
            document.getElementById(id).addEventListener('click', function () {
                if (nuevoNumero || et_resultado.value === '0') {
                    et_resultado.value = String(numero);
                } else {
                    et_resultado.value += numero;
                }
                nuevoNumero = false;
            });
        }

        document.getElementById('btn_punto').addEventListener('click', function () {
            if (nuevoNumero) {
                et_resultado.value = '0';
                nuevoNumero = false;
            }
            if (!et_resultado.value.includes('.')) {
                et_resultado.value += '.';
            }
        });

        document.getElementById('btn_masmenos').addEventListener('click', function () {
            if (et_resultado.value === 'Error') return;
            if (nuevoNumero && operacion) et_resultado.value = '0';
            et_resultado.value = et_resultado.value.startsWith('-')
                ? et_resultado.value.slice(1)
                : '-' + et_resultado.value;
            nuevoNumero = false;
        });

        // Resolver la operación pendiente usando el número de la pantalla.
        function calcular() {
            const segundoNumero = Number(et_resultado.value);
            let resultado = primerNumero;

            if (operacion === '+') resultado += segundoNumero;
            if (operacion === '-') resultado -= segundoNumero;
            if (operacion === '*') resultado *= segundoNumero;

            et_resultado.value = Number.isFinite(resultado)
                ? String(Number(resultado.toPrecision(12)))
                : 'Error';
            primerNumero = null;
            operacion = '';
            nuevoNumero = true;
        }

        function seleccionarOperacion(signo) {
            if (operacion && !nuevoNumero) calcular();
            if (et_resultado.value === 'Error') return;
            primerNumero = Number(et_resultado.value);
            operacion = signo;
            nuevoNumero = true;
        }

        document.getElementById('btn_mas').addEventListener('click', function () {
            seleccionarOperacion('+');
        });
        document.getElementById('btn_menos').addEventListener('click', function () {
            seleccionarOperacion('-');
        });
        document.getElementById('btn_multi').addEventListener('click', function () {
            seleccionarOperacion('*');
        });
        document.getElementById('btn_igual').addEventListener('click', function () {
            if (operacion && !nuevoNumero) calcular();
        });
    </script>
</body>
