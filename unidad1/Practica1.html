<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1</title>
    <style>
        body {
            background-color: rgb(187, 230, 230);
            font-family: Georgia, 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .contenedor-principal {
            width: 95%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: rgb(251, 238, 238);
            padding: 20px;
            border-radius: 15px;
            gap: 20px;
        }

        .columna-texto {
            width: 55%;
            text-align: center;
        }

        .columna-imagen {
            width: 40%;
            text-align: center;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;    
        }

        .sombra {
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.25);
        }

        p {
            text-align: center;
            line-height: 1.5;
        }

        .btn-enlace {
            display: inline-block;
            background-color: coral;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-control {
            background-color: green;
            border: 1px solid red;
            border-radius: 10px;
            padding: 6px 12px;
            color: white;
            cursor: pointer;
            margin: 4px;
        }

        .btn-control:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div class="columna-texto">
            <h1>Miku y Gohan</h1> 
            <p>
                Es un fotomontaje absurdo donde Yamcha, de Dragon Ball Z,
                es fulminado por la espalda por un rayo de energía brillante
                que sale de la boca de una figura pequeña y flotante de Hatsune Miku.
            </p>
            <a class="btn-enlace" href="https://www.youtube.com/watch?v=neEQ_zUu-BE" target="_blank" rel="noopener noreferrer">Ver Video</a>
        </div>

        <div class="columna-imagen">
            <img src="fotos/miku.webp" alt="Miku con Gohan" class="sombra">
            <p id="frases"></p>
            <button class="btn-control" onclick="mostrarFraseAnterior()">Frase Anterior</button>
            <button class="btn-control" onclick="cambiarFrase()">Siguiente Frase</button>
        </div>
        <input style="background-color: rgb(187, 230, 230); border: none; border-radius: 10px; padding: 6px 12px; color: rgb(18, 17, 17); cursor: pointer; margin-top: 10px;" type="text" placeholder="Escribe una frase..." id="caja_texto">
        <button class="btn-control" onclick="mostrarSaludo()">mostrar saludo 🤣</button>
        <div id="contenedor">
            <p>Hola mundo</p>
        </div>
    </div>

    <script>
        const arreglo = ['miku es la mejor', 'gohan es el mejor', 'yamcha es el mejor'];
        const frase = document.getElementById('frases');
        let indice = 0;

        // Mostrar la primera frase al cargar la página
        frase.innerText = arreglo[indice];

        function cambiarFrase() {
            if (indice < arreglo.length - 1) {
                indice++;
                frase.innerText = arreglo[indice];
            }
        }

        function mostrarFraseAnterior() {
            if (indice > 0) {
                indice--;
                frase.innerText = arreglo[indice];
            }
        }
    </script>
</body>
</html>
